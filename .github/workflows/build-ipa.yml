name: Build IPA

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Archive
        run: |
          xcodebuild \
            -project "Focus Plus.xcodeproj" \
            -scheme "Focus Plus" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FocusPlus.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES=Minimal

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/FocusPlus.xcarchive/Products/Applications/Focus Plus.app" Payload/
          zip -qry FocusPlus.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusPlus-ipa
          path: FocusPlus.ipa
          if-no-files-found: error

      - name: Read app version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleShortVersionString" \
            "build/FocusPlus.xcarchive/Products/Applications/Focus Plus.app/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
