name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, preview]
    paths:
      - "Focus Plus.xcodeproj/**"
      - "Focus Plus/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that the source is present
        run: |
          if [ ! -d "Focus Plus.xcodeproj" ]; then
            echo "::error::This repository carries no app source by design. Focus Plus is closed source: put the Xcode project and the app folder in the working tree (or check them out from the private source repository) before running this workflow."
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Archive
        run: |
          xcodebuild \
            -project "Focus Plus.xcodeproj" \
            -scheme "Focus Plus" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FocusPlus.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/FocusPlus.xcarchive/Products/Applications/Focus Plus.app" Payload/
          zip -qry FocusPlus.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusPlus-ipa
          path: FocusPlus.ipa
          if-no-files-found: error

      - name: Read app version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleShortVersionString" \
            "build/FocusPlus.xcarchive/Products/Applications/Focus Plus.app/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Attach the IPA to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.version.outputs.version) }}
          name: ${{ format('v{0}', steps.version.outputs.version) }}
          body: |
            Unsigned Release IPA of Focus Plus, built from the private source.
            Re-sign it with your own certificate to install it on a device.
          files: FocusPlus.ipa
          fail_on_unmatched_files: true
          make_latest: true
